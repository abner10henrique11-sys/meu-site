<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zupfit - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Biblioteca do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0A0A0A] text-white min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-[#141414] border border-[#222] p-6 rounded-2xl shadow-xl space-y-6">
    <div class="text-center">
      <h1 class="text-2xl font-black">ZUP<span class="text-[#39FF14]">FIT</span></h1>
      <p class="text-xs text-gray-400 mt-1">Acesso Administrativo & Alunos</p>
    </div>

    <!-- Caixa de mensagem de erro -->
    <div id="msg-erro" class="hidden bg-red-900/50 border border-red-500 text-red-200 text-xs p-3 rounded-lg text-center font-medium"></div>

    <!-- Formulário correto com onsubmit -->
    <form onsubmit="fazerLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">E-mail</label>
        <input type="email" id="email" required class="w-full bg-[#1A1A1A] border border-[#333] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#39FF14]" placeholder="seu@email.com">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Senha</label>
        <input type="password" id="senha" required class="w-full bg-[#1A1A1A] border border-[#333] rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#39FF14]" placeholder="••••••••">
      </div>
      <button type="submit" id="btn-entrar" class="w-full bg-[#39FF14] text-black font-bold py-3.5 rounded-xl text-sm transition hover:bg-[#32e010]">
        ENTRAR NO SISTEMA
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://epnglgoculunujdnmjfc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_haq04u0CuNCsbgyVWn_RvA_DS9mwlYR";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const ADMIN_EMAIL = "abner10henrique11@gmail.com";

    async function fazerLogin(e) {
      // Impede que a página seja recarregada ou limpa ao apertar Enter
      if (e) e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const msgBox = document.getElementById('msg-erro');
      msgBox.classList.add('hidden');

      if (!email || !senha) {
        msgBox.textContent = "Preencha o e-mail e a senha!";
        msgBox.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('btn-entrar');
      btn.textContent = "Verificando...";
      btn.disabled = true;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });
        
        if (error) {
          msgBox.textContent = "Erro no Supabase: " + error.message;
          msgBox.classList.remove('hidden');
          btn.textContent = "ENTRAR NO SISTEMA";
          btn.disabled = false;
          return;
        }

        if (data.user) {
          if (data.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
            alert("👑 Acesso de Administrador confirmado para Abner!");
          } else {
            alert("🏋️ Login realizado com sucesso como Aluno!");
          }
          btn.textContent = "ENTRAR NO SISTEMA";
          btn.disabled = false;
        }
      } catch (err) {
        msgBox.textContent = "Erro inesperado: " + err.message;
        msgBox.classList.remove('hidden');
        btn.textContent = "ENTRAR NO SISTEMA";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
